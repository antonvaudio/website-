<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>antonvaudio</title>
  <meta name="description" content="Anton Vasiliadis is a Scotland-based sound designer, technician, and multimedia artist working across immersive performance, experimental audio, and interactive installations." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #ffffff;
      --text: #111;
      --muted: #666;
      --border: #e8e8e8;
      --font: 'Inter', sans-serif;
      --nav-h: 64px;
    }

    body {
      font-family: var(--font);
      background: var(--white);
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-h);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
      background: white;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { cursor: pointer; }

    .screen { display: none; padding-top: var(--nav-h); }
    .screen.active { display: block; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-item {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      cursor: pointer;
      background: #111;
    }

    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-wrap { max-width: 860px; margin: 0 auto; padding: 3rem 2rem; }

    .detail-images {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .detail-images img {
      width: 100%;
      height: auto;
      display: block;
    }

    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .detail-images { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<nav>
  <div onclick="showScreen('works')" style="cursor:pointer;">antonvaudio</div>
  <ul class="nav-links">
    <li><a onclick="showScreen('works')">Works</a></li>
    <li><a onclick="showScreen('about')">About</a></li>
    <li><a onclick="showScreen('contact')">Contact</a></li>
  </ul>
</nav>

<div class="screen active" id="screen-works">
  <div class="grid" id="grid"></div>
</div>

<div class="screen" id="screen-detail">
  <div class="detail-wrap">
    <div id="detail-content"></div>
  </div>
</div>

<script>
const works = [
  {
    id: 'kissyris',
    title: 'Kissyris',
    thumb: 'Still+2026-05-14+003125_1.1.1.jpg.jpeg',
    youtube: 'd4XbtKQDlgg',
    body: `<p><strong>Description</strong><br/>Kissyris...</p>`
  },

  {
    id: 'surrender',
    title: 'Surrender(d)',
    thumb: 'https://static1.squarespace.com/static/642fc56bbbaf430a1a7b64a6/642fc6072e224e44337714ba/6895dbb643edfd1e173f298b/1754652588842/Screenshot+2025-08-08+121443.png?format=750w',
    youtube: 'h6ithpvvg1A',
    body: `<p>Surrender(d)...</p>`
  },

  {
    id: 'explore',
    title: 'Explore',
    thumb: '01.webp',


    body: `<p><strong>Description</strong><br/>
    Thrilled to share that I received Explore strand funding...</p>
    <p>More soon x</p>`
  }
];

const grid = document.getElementById('grid');

works.forEach(w => {
  const div = document.createElement('div');
  div.className = 'grid-item';
  div.innerHTML = `<img src="${w.thumb}" /><div>${w.title}</div>`;
  div.onclick = () => showWork(w.id);
  grid.appendChild(div);
});

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}

function showWork(id) {
  const w = works.find(x => x.id === id);

  let html = `<h1>${w.title}</h1>`;

  if (w.youtube) {
    html += `
      <iframe width="100%" height="400"
      src="https://www.youtube.com/embed/${w.youtube}"
      frameborder="0" allowfullscreen></iframe>
    `;
  }

  if (w.images && w.images.length) {
    html += `<div class="detail-images">`;
    w.images.forEach(src => {
      html += `<img src="images/${src}" />`;
    });
    html += `</div>`;
  }

  html += w.body;

  document.getElementById('detail-content').innerHTML = html;
  showScreen('detail');
}
</script>

</body>
</html>
